name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: leads_test
          POSTGRES_USER: leads
          POSTGRES_PASSWORD: leads
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leads"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgis://leads:leads@localhost:5432/leads_test
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-only-key-not-used-in-production
      DJANGO_SETTINGS_MODULE: config.settings.test

    steps:
      - uses: actions/checkout@v4

      - name: Instalar GDAL/GEOS (exigidos pelo GeoDjango)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils gdal-bin libgdal-dev libgeos-dev libproj-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Formatação (black)
        run: black --check .

      - name: Tipos (mypy)
        run: mypy .

      - name: Migrations sem pendências
        run: python manage.py makemigrations --check --dry-run

      - name: Testes
        run: pytest --cov=apps --cov-report=term-missing

      - name: Checagem de deploy com settings de produção
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-only-key-with-at-least-fifty-characters-to-pass-validation
          DJANGO_ALLOWED_HOSTS: example.com
          CORS_ALLOWED_ORIGINS: https://example.com
          CSRF_TRUSTED_ORIGINS: https://example.com
        run: python manage.py check --deploy --fail-level WARNING

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Formatação (prettier)
        run: npm run format:check

      - name: Tipos (tsc)
        run: npm run typecheck

      - name: Testes
        run: npm run test

      - name: Build
        run: npm run build

  seguranca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vulnerabilidades nas dependências Python
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --strict

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Vulnerabilidades nas dependências Node
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Nenhum .env versionado
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.[^e]'; then
            echo "Arquivo .env versionado. Segredo nunca entra no Git (SECURITY.md)."
            exit 1
          fi
