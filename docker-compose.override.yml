# Ajustes de desenvolvimento. O Compose carrega este arquivo automaticamente em
# `docker compose up` e o ignora quando os arquivos são passados com -f explicitamente
# (é assim que produção não herda porta de banco exposta nem código montado).

services:
  db:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  backend:
    volumes:
      - ./backend:/app
      - backend_static:/app/staticfiles

  celery_worker:
    volumes:
      - ./backend:/app
    # O `runserver` do backend recarrega sozinho; o worker do Celery não. Sem isto ele fica
    # com o código de quando subiu, e o sintoma é o pior possível: a task roda, não dá erro
    # nenhum, e grava dado pela metade. Já aconteceu duas vezes nesta base.
    command: >
      watchmedo auto-restart --directory=/app --pattern=*.py --recursive --
      celery -A config worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-2}

  frontend:
    environment:
      WATCHPACK_POLLING: "true" # hot reload com volume montado no WSL
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
