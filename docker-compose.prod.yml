# Sobreposição de produção.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Passar os arquivos com -f impede o carregamento do docker-compose.override.yml, então
# aqui não existe código montado como volume nem porta de banco publicada.

# Cada serviço marca a imagem com nome próprio (`-prod`). Sem isso o build de produção
# reaproveita a tag do dev e a sobrescreve — o ambiente de desenvolvimento fica sem as
# dependências de dev e só quebra na próxima vez que alguém sobe, longe da causa.

services:
  backend:
    image: leads-backend-prod
    build:
      context: ./backend
      args:
        INSTALL_DEV: "false"
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers ${GUNICORN_WORKERS:-3}
      --timeout 60
      --access-logfile -
      --error-logfile -
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production

  celery_worker:
    image: leads-celery-worker-prod
    build:
      context: ./backend
      args:
        INSTALL_DEV: "false"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production

  # `celery_beat` volta junto com a primeira tarefa periódica (ver docker-compose.yml).

  frontend:
    image: leads-frontend-prod
    build:
      context: ./frontend
      target: runner
    command: node server.js
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:8000
