# Definição base dos serviços, comum a todos os ambientes.
#
#   dev   : docker compose up            (carrega docker-compose.override.yml automaticamente)
#   prod  : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Portas de banco e código montado como volume ficam no override de dev — assim não há
# risco de vazarem para produção.

name: leads

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: leads_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leads}
      POSTGRES_USER: ${POSTGRES_USER:-leads}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leads}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leads} -d ${POSTGRES_DB:-leads}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: leads_redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: leads_backend
    command: python manage.py runserver 0.0.0.0:8000
    env_file: [.env]
    volumes:
      - backend_static:/app/staticfiles
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen('http://localhost:8000/health/live')
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  celery_worker:
    build:
      context: ./backend
    container_name: leads_celery_worker
    command: celery -A config worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-2}
    env_file: [.env]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Sem isto, um worker que morreu continua aparecendo como "up" — e a fila entope em
    # silêncio, que é justamente onde a falha custa mais caro.
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # `celery_beat` sai daqui até existir a primeira tarefa periódica. Não há `beat_schedule`
  # em lugar nenhum do backend, então o processo subia ocioso — recurso gasto para nada e
  # um serviço a mais para o operador achar que precisa monitorar. Volta na etapa que criar
  # trabalho agendado (purga de provider efêmero, ADR-0004).

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: leads_frontend
    command: npm run dev
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_static:
